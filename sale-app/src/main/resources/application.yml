server:
  port: 8081

spring:
  application:
    name: sale-app
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/sale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:sale}
    password: ${MYSQL_PASSWORD:change-me-local}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration

rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:localhost:9876}
  producer:
    group: sale-app-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
